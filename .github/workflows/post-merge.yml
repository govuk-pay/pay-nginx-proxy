name: Post Merge

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'

permissions:
  contents: read

concurrency: nginx-proxy-post-merge

jobs:
  image-tests:
    name: Run Docker Image Tests
    uses: ./.github/workflows/run-tests.yml

  tag-release:
    name: Tag Release
    needs: image-tests
    permissions:
      contents: write
    uses: govuk-pay/pay-ci/.github/workflows/_create-alpha-release-tag.yml@c1bed255fa76164f86f2b0f0f20df26ea58ab1c6