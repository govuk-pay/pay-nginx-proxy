name: Post Merge

on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/**'

permissions:
  contents: read

concurrency: nginx-proxy-post-merge

jobs:
  image-tests:
    name: Run Docker Image Tests
    uses: ./.github/workflows/run-tests.yml

  tag-release:
    name: Tag Release
    needs: image-tests
    permissions:
      contents: write
    uses: govuk-pay/pay-ci/.github/workflows/_create-alpha-release-tag.yml@2f600380181d780f79bc92c3f648a23c6f2ab17d # 0.0.2
